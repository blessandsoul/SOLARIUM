<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f5">
  <meta name="description" content="Solarium.ge — ვერტიკალური და ჰორიზონტალური სოლარიუმები მალე.">
  <title>Solarium.ge — Coming Soon</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Dancing+Script:wght@600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f8f5;
      --ink: #20211f;
      --muted: #777873;
      --line: #deded8;
      --sun: #d9a650;
      font-family: "Noto Sans Georgian", "DM Sans", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; min-height: 100%; background: var(--paper); }
    body { min-width: 320px; min-height: 100svh; margin: 0; color: var(--ink); background: var(--paper); }
    .page { width: min(100%, 1500px); margin: 0 auto; padding: 0 clamp(20px, 6.3vw, 96px); }
    .masthead { display: flex; min-height: 94px; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); }
    .wordmark { display: inline-flex; align-items: center; gap: 12px; font-family: "DM Sans", sans-serif; font-size: clamp(24px, 3vw, 34px); font-weight: 600; letter-spacing: -.04em; }
    .sun-mark { display: block; width: clamp(31px, 3.5vw, 40px); height: clamp(31px, 3.5vw, 40px); flex: none; color: var(--sun); }
    .wordmark .name span { color: var(--sun); }
    main { padding: clamp(23px, 3.8vw, 53px) 0 48px; }
    .products { display: grid; grid-template-columns: minmax(0, 1fr); align-items: stretch; gap: 0; }
    .product { width: min(100%, 1100px); min-width: 0; margin: 0; justify-self: center; }
    .product-art { display: grid; aspect-ratio: 3 / 2; place-items: center; overflow: visible; background: transparent; }
    .product img { display: block; width: 94%; height: auto; object-fit: contain; filter: drop-shadow(0 16px 24px rgba(76, 57, 35, .12)); }
    .soon { margin: 9px 0 0; font-family: "DM Sans", sans-serif; font-size: clamp(45px, 7.92vw, 104.4px); font-weight: 500; line-height: .95; letter-spacing: -.075em; text-align: center; }
    .tagline { margin: 14px 0 clamp(8px, 1.6vw, 18px); color: #57564f; font-family: "DM Sans", sans-serif; font-size: clamp(14.4px, 1.68vw, 19.2px); font-weight: 600; letter-spacing: .005em; line-height: 1.5; text-align: center; text-wrap: balance; }
    .contact { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 13px clamp(22px, 4vw, 42px); margin-top: clamp(12px, 2vw, 28px); font-family: "DM Sans", "Noto Sans Georgian", sans-serif; }
    .email { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-size: clamp(16px, 2vw, 19px); font-weight: 400; }
    .email svg { width: 19px; height: 19px; flex: none; color: var(--sun); }
    .phone { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-size: 15px; letter-spacing: .07em; }
    .phone svg { width: 19px; height: 19px; flex: none; color: var(--sun); }
    .brands { display: flex; min-height: 112px; align-items: center; justify-content: center; gap: clamp(12px, 1.4vw, 20px); margin-top: clamp(46px, 7vw, 84px); padding-top: 25px; border-top: 1px solid var(--line); }
    .brand { display: flex; width: 196px; flex: 0 1 196px; flex-direction: column; align-items: center; justify-content: center; color: #3c3e3b; }
    .brand-item { display: flex; align-items: center; justify-content: center; height: 65px; width: 100%; }
    .brand-item img { display: block; max-width: 100%; max-height: 32px; width: auto; height: auto; object-fit: contain; }
    .brand-logo { flex: none; }
    .brand.megasun .brand-logo { transform: translateY(-2px); }
    .brand.ergoline .brand-logo {filter: grayscale(1) brightness(.42);}
    .brand.ultrasun .brand-logo {filter: grayscale(1) brightness(.42);}
    .brand-country { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; color: var(--muted); font-family: "DM Sans", sans-serif; font-size: 10px; line-height: 1; white-space: nowrap; }
    .brand-country svg { display: block; width: 16px; height: 12px; flex: none; border-radius: 1px; box-shadow: 0 0 0 1px rgba(32, 33, 31, .09); }
    @media (max-width: 720px) {
      .page { padding-inline: 18px; }
      .masthead { min-height: 76px; }
      main { padding-top: 19px; }
      .products { grid-template-columns: 1fr; gap: 24px; }
      .product { width: min(100%, 540px); justify-self: center; }
      .soon { margin: 5px 0 0; }
      .tagline { margin: 12px 0 14px; }
      .contact { margin-top: 10px; }
      .brands { min-height: 96px; margin-top: 50px; flex-wrap: wrap; justify-content: center; gap: 18px 12px; }
      .brand { width: calc((100% - 24px) / 3); min-width: 0; flex: 0 0 calc((100% - 24px) / 3); }
      .brand-item img { max-height: clamp(14px, 4vw, 28px); }
      .brand-country { max-width: 100%; min-height: 20px; flex-wrap: wrap; justify-content: center; gap: 3px; font-size: 8px; line-height: 1.1; text-align: center; white-space: normal; }
    }
    @media (max-width: 380px) {
      .page { padding-inline: 14px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="wordmark">
        <svg class="sun-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="7" fill="currentColor"/>
          <path d="M20 2.5v4M20 33.5v4M2.5 20h4M33.5 20h4M7.63 7.63l2.83 2.83m19.08 19.08 2.83 2.83m0-24.74-2.83 2.83m-19.08 19.08-2.83 2.83" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="20" cy="20" r="12.5" stroke="currentColor" stroke-width="1.3" opacity=".42"/>
        </svg>
        <span class="name">Solarium<span>.ge</span></span>
      </div>
    </header>
    <main>
      <h1 class="soon">Coming Soon</h1>
      <p class="tagline">Premium Tanning Equipment in Georgia</p>
      <section class="products" aria-label="ჰორიზონტალური სოლარიუმი">

        <figure class="product">
          <div class="product-art"><img src="solarium-horizontal-crystal.png" alt="ჰორიზონტალური სოლარიუმის საილუსტრაციო რენდერი"></div>
        </figure>

      </section>
      <section class="contact" aria-label="საკონტაქტო ინფორმაცია">
        <div class="email">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.25" y="5.25" width="17.5" height="13.5" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="m4.5 7 7.5 6 7.5-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>hi@solarium.ge</span>
        </div>
        <div class="phone">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.35 1.9.69 2.8a2 2 0 0 1-.45 2.11L8.08 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.84.57 2.8.69A2 2 0 0 1 22 16.92Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>+995 596919191</span>
        </div>
      </section>
      <section class="brands" aria-label="წარმოდგენილი ბრენდები">
        <div class="brand ergoline"><div class="brand-item"><img class="brand-logo" src="brand-logos/ergoline.png" alt="Ergoline"></div><span class="brand-country"><svg viewBox="0 0 24 18" aria-hidden="true"><path fill="#171717" d="M0 0h24v6H0z"/><path fill="#d00" d="M0 6h24v6H0z"/><path fill="#ffce00" d="M0 12h24v6H0z"/></svg>Germany</span></div>
        <div class="brand megasun"><div class="brand-item"><img class="brand-logo" src="brand-logos/megasun-trim.png" alt="megaSun"></div><span class="brand-country"><svg viewBox="0 0 24 18" aria-hidden="true"><path fill="#171717" d="M0 0h24v6H0z"/><path fill="#d00" d="M0 6h24v6H0z"/><path fill="#ffce00" d="M0 12h24v6H0z"/></svg>KBL · Germany</span></div>
        <div class="brand luxura"><div class="brand-item"><img class="brand-logo" src="brand-logos/luxura.svg" alt="Luxura"></div><span class="brand-country"><svg viewBox="0 0 24 18" aria-hidden="true"><path fill="#ae1c28" d="M0 0h24v6H0z"/><path fill="#fff" d="M0 6h24v6H0z"/><path fill="#21468b" d="M0 12h24v6H0z"/></svg>Hapro · Netherlands</span></div>
        <div class="brand ultrasun"><div class="brand-item"><img class="brand-logo" src="brand-logos/ultrasun.svg" alt="Ultrasun"></div><span class="brand-country"><svg viewBox="0 0 24 18" aria-hidden="true"><path fill="#ae1c28" d="M0 0h24v6H0z"/><path fill="#fff" d="M0 6h24v6H0z"/><path fill="#21468b" d="M0 12h24v6H0z"/></svg>Netherlands</span></div>
        <div class="brand prosun"><div class="brand-item"><img class="brand-logo" src="brand-logos/prosun.svg" alt="ProSun"></div><span class="brand-country"><svg viewBox="0 0 24 18" aria-hidden="true"><path fill="#fff" d="M0 0h24v18H0z"/><path fill="#b22234" d="M0 0h24v2H0zm0 4h24v2H0zm0 4h24v2H0zm0 4h24v2H0zm0 4h24v2H0z"/><path fill="#3c3b6e" d="M0 0h11v10H0z"/><g fill="#fff"><circle cx="2" cy="2" r=".55"/><circle cx="5.5" cy="2" r=".55"/><circle cx="9" cy="2" r=".55"/><circle cx="3.75" cy="4.5" r=".55"/><circle cx="7.25" cy="4.5" r=".55"/><circle cx="2" cy="7" r=".55"/><circle cx="5.5" cy="7" r=".55"/><circle cx="9" cy="7" r=".55"/></g></svg>USA</span></div>
      </section>
    </main>
  </div>
</body>
</html>
