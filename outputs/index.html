<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="solarium.ge — სოლარიუმების ყველაზე დიდი იმპორტიორი საქართველოში"
    />
    <title>solarium.ge | მალე</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+Georgian:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #06181d;
        --cream: #fff9ed;
        --muted: #d3dbd6;
        --gold: #f2b65c;
        --green: #2cb876;
        --green-bright: #45d987;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--ink);
      }

      body {
        min-height: 100svh;
        margin: 0;
        color: var(--cream);
        background: var(--ink);
        font-family: "Noto Sans Georgian", sans-serif;
      }

      .landing {
        position: relative;
        isolation: isolate;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(1.5rem, 4vw, 3.25rem) clamp(1.5rem, 6vw, 6.5rem);
        overflow: hidden;
      }

      /* The generated artwork remains quiet under the copy; the left-side shade protects readability. */
      .scene,
      .landing::before,
      .landing::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .scene {
        z-index: -3;
        background: url("./hero-light-installation.png") 60% center / cover no-repeat;
        animation: scene-drift 20s ease-in-out infinite alternate;
        transform: scale(1.025);
      }

      .landing::before {
        z-index: -2;
        content: "";
        background:
          linear-gradient(90deg, rgba(3, 18, 23, 0.98) 0%, rgba(3, 18, 23, 0.89) 27%, rgba(3, 18, 23, 0.56) 51%, rgba(3, 18, 23, 0.08) 76%),
          linear-gradient(0deg, rgba(2, 14, 18, 0.58), transparent 46%);
      }

      .landing::after {
        z-index: -1;
        content: "";
        background: radial-gradient(ellipse at 76% 0%, rgba(252, 194, 104, 0.14), transparent 35%);
      }

      @keyframes scene-drift {
        from {
          background-position: 58% center;
        }

        to {
          background-position: 63% center;
        }
      }

      .wordmark {
        width: fit-content;
        color: var(--cream);
        font-family: "Manrope", sans-serif;
        font-size: clamp(1.15rem, 2vw, 1.4rem);
        font-weight: 800;
        letter-spacing: -0.075em;
        line-height: 1;
        text-transform: lowercase;
      }

      .wordmark::after {
        content: "";
        width: 2.45rem;
        height: 2px;
        display: block;
        margin-top: 0.8rem;
        background: var(--gold);
      }

      .hero {
        width: min(100%, 40rem);
        margin: auto 0;
        padding: 4rem 0 3rem;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        max-width: 8ch;
        color: var(--cream);
        font-size: clamp(3.45rem, 9.2vw, 7.6rem);
        font-weight: 800;
        letter-spacing: -0.09em;
        line-height: 0.97;
      }

      .statement {
        max-width: 34rem;
        margin-top: clamp(1.5rem, 3vw, 2.15rem);
        color: var(--muted);
        font-size: clamp(1rem, 1.85vw, 1.22rem);
        font-weight: 500;
        line-height: 1.72;
      }

      .contact {
        width: fit-content;
        margin-top: clamp(2.25rem, 5vw, 4.4rem);
        display: inline-grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 0.82rem;
        padding: 0.42rem 1.25rem 0.42rem 0.45rem;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 0.55rem;
        background: rgba(1, 13, 17, 0.42);
        color: var(--cream);
        font-family: "Manrope", "Noto Sans Georgian", sans-serif;
        font-size: 0.98rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        text-decoration: none;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        transition: border-color 180ms ease, background-color 180ms ease, transform 180ms ease;
      }

      .contact:hover {
        transform: translateY(-2px);
        border-color: rgba(101, 242, 160, 0.8);
        background: rgba(21, 131, 78, 0.4);
      }

      .contact:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 4px;
      }

      .whatsapp-icon {
        width: 2.45rem;
        height: 2.45rem;
        padding: 0.53rem;
        border-radius: 0.34rem;
        background: var(--green);
        color: white;
      }

      .contact:hover .whatsapp-icon {
        background: var(--green-bright);
      }

      @media (max-width: 680px) {
        .landing {
          padding: 1.5rem;
        }

        .scene {
          background-position: 68% center;
        }

        .landing::before {
          background:
            linear-gradient(90deg, rgba(3, 18, 23, 0.93), rgba(3, 18, 23, 0.64)),
            linear-gradient(0deg, rgba(2, 14, 18, 0.64), transparent 60%);
        }

        .hero {
          margin: auto 0 0;
          padding: 3.5rem 0 2rem;
        }

        h1 {
          font-size: clamp(3.45rem, 16vw, 5.2rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .scene {
          animation: none;
        }

        .contact {
          transition: none;
        }

        .contact:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="landing">
      <div class="scene" aria-hidden="true"></div>

      <div class="wordmark" aria-label="solarium.ge">solarium.ge</div>

      <section class="hero" aria-label="მალე">
        <h1>მალე…</h1>
        <p class="statement">სოლარიუმების ყველაზე დიდი იმპორტიორი საქართველოში</p>

        <a
          class="contact"
          href="https://wa.me/995592592332"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="მოგვწერეთ WhatsApp-ზე: 592 592 332"
        >
          <!-- Inline SVG keeps the WhatsApp action crisp and removes a separate icon dependency. -->
          <svg class="whatsapp-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M20.52 3.48A11.84 11.84 0 0 0 12.08 0C5.53 0 .2 5.33.2 11.88c0 2.09.55 4.13 1.58 5.92L.1 24l6.36-1.67a11.84 11.84 0 0 0 5.61 1.43h.01c6.54 0 11.87-5.33 11.87-11.88 0-3.17-1.23-6.15-3.43-8.4ZM12.08 21.76c-1.8 0-3.56-.48-5.1-1.39l-.37-.22-3.77.99 1.01-3.68-.24-.38a9.82 9.82 0 0 1-1.5-5.2c0-5.51 4.48-9.99 9.99-9.99 2.66 0 5.16 1.04 7.04 2.93a9.92 9.92 0 0 1 2.91 7.05c0 5.51-4.48 9.99-9.98 9.99Zm5.47-7.49c-.3-.15-1.79-.88-2.07-.98-.28-.1-.48-.15-.69.15-.2.3-.79.98-.97 1.18-.18.2-.36.22-.66.07-.3-.15-1.28-.47-2.43-1.5-.9-.81-1.51-1.82-1.69-2.12-.18-.3-.02-.46.13-.61.13-.13.3-.36.45-.54.15-.18.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.69-1.66-.94-2.27-.25-.6-.5-.52-.69-.53h-.59c-.2 0-.52.08-.79.38-.28.3-1.04 1.01-1.04 2.46s1.07 2.86 1.22 3.06c.15.2 2.1 3.21 5.08 4.5.71.31 1.26.49 1.69.63.71.23 1.35.2 1.86.12.57-.09 1.79-.73 2.04-1.44.25-.71.25-1.32.18-1.44-.07-.13-.27-.2-.57-.35Z"
            />
          </svg>
          <span>592 592 332</span>
        </a>
      </section>
    </main>
  </body>
</html>
